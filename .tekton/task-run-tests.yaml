apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-tests
spec:
  params:
    - name: repo-url
      type: string
      description: Git repository URL to clone
    - name: revision
      type: string
      description: Git revision (branch, tag, or commit SHA) to checkout
      default: main
  workspaces:
    - name: source
      description: Workspace where source code is cloned and tests run
  steps:
    - name: clone
      image: golang:1.24
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        git init
        git remote add origin $(params.repo-url)
        git fetch --depth=1 origin $(params.revision)
        git checkout FETCH_HEAD

    - name: test
      image: golang:1.24
      workingDir: $(workspaces.source.path)
      env:
        - name: GOFLAGS
          value: "-mod=mod"
        - name: CGO_ENABLED
          value: "0"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        go mod tidy
        go mod download
        # Download controller-gen and setup-envtest into ./bin (required by make test)
        make controller-gen setup-envtest
        make test
